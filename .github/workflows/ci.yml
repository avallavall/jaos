name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 cmake mingw-w64 wine64
      - name: Cache the Netlib instances
        uses: actions/cache@v4
        with:
          path: |
            bench/instances
            bench/instances-infeas
          key: netlib-${{ hashFiles('bench/netlib.manifest', 'bench/netlib-infeas.manifest', 'bench/fetch.sh') }}
      - name: Fetch the Netlib instances the tests read
        run: |
          bench/fetch.sh
          bench/fetch.sh -m bench/netlib-infeas.manifest \
            -b https://netlib.org/lp/infeas -p emps bench/instances-infeas
      - name: make test
        run: make test
      - name: make sanitize
        run: make sanitize
      - name: make python-test
        run: make python-test
      - name: make sdist-test
        run: make sdist-test

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record the commit for the build container
        run: git rev-parse --short=12 HEAD > COMMIT
      - name: Build and test the manylinux wheel
        run: pipx run cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: python -c "import jaos; print(jaos.version(), jaos.build_commit(), jaos.library_path())"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-x86_64
          path: wheelhouse/*.whl

  wheel-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64 and cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64
      - name: Build libjaos.dll with mingw-w64
        run: |
          cmake -S . -B build/win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DJAOS_BUILD_TESTS=OFF -DJAOS_LTO=OFF
          cmake --build build/win --parallel
          x86_64-w64-mingw32-objdump -p build/win/libjaos.dll | grep 'DLL Name'
      - name: Build the win_amd64 wheel around it
        run: pipx run build --wheel --outdir wheelhouse
        env:
          JAOS_WHEEL_LIBRARY: build/win/libjaos.dll
          JAOS_WHEEL_PLAT: win_amd64
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win-amd64
          path: wheelhouse/*.whl

  wheel-windows-test:
    needs: wheel-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-win-amd64
          path: wheelhouse
      - name: Install the wheel and solve with it
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python -c "import jaos; print(jaos.version(), jaos.library_path())"
          python -m jaos solve "$GITHUB_WORKSPACE/tests/data/solve1.mps"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14
        run: brew install gcc@14
      - name: Build with CMake and run the unit suite
        run: |
          cmake -S . -B build/mac -DCMAKE_C_COMPILER=gcc-14 -DJAOS_LTO=OFF
          cmake --build build/mac --parallel
          ctest --test-dir build/mac --output-on-failure -E '^cli$'
      - name: Solve with the tool
        run: |
          build/mac/jaos solve tests/data/solve1.mps
          build/mac/jaos solve tests/data/t4_int.mps

  windows-clang-cl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with clang-cl and solve with the tool
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          clang-cl --version
          cmake -S . -B build\clcl -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release -DJAOS_LTO=OFF -DJAOS_BUILD_TESTS=OFF || exit /b 1
          cmake --build build\clcl || exit /b 1
          build\clcl\jaos.exe solve tests\data\solve1.mps || exit /b 1
          build\clcl\jaos.exe solve tests\data\t4_int.mps || exit /b 1
