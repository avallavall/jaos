name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag to build and publish, for example v0.4.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  wheel-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check that the tag names the version jaos.h carries
        run: |
          want=$(sed -n 's/^#define JAOS_VERSION_STRING "\(.*\)"$/\1/p' include/jaos.h)
          [ "$TAG" = "v$want" ] || { echo "tag $TAG, include/jaos.h $want"; exit 1; }
      - name: Record the commit for the build container
        run: git rev-parse --short=12 HEAD > COMMIT
      - name: Build and test the manylinux wheel
        run: pipx run cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: python -c "import jaos; print(jaos.version(), jaos.library_path())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-manylinux-x86_64
          path: dist/*.whl

  wheel-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install mingw-w64 and cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake mingw-w64
      - name: Build libjaos.dll with mingw-w64
        run: |
          cmake -S . -B build/win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DJAOS_BUILD_TESTS=OFF -DJAOS_LTO=OFF
          cmake --build build/win --parallel
      - name: Build the win_amd64 wheel around it
        run: pipx run build --wheel --outdir dist
        env:
          JAOS_WHEEL_LIBRARY: build/win/libjaos.dll
          JAOS_WHEEL_PLAT: win_amd64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win-amd64
          path: dist/*.whl

  wheel-windows-test:
    needs: wheel-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-win-amd64
          path: dist
      - name: Install the wheel and solve with it
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import jaos; print(jaos.version(), jaos.library_path())"
          python -m jaos solve "$GITHUB_WORKSPACE/tests/data/solve1.mps"

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build the sdist
        run: pipx run build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  github-release:
    needs: [wheel-linux, wheel-windows-test, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Make the GitHub Release with the wheels and the sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "JAOS ${TAG#v}" --generate-notes --verify-tag
          fi

  pypi:
    needs: [wheel-linux, wheel-windows-test, sdist]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/jaos/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI by trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
