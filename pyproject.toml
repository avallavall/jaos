[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jaos"
version = "0.3.0"
description = "JAOS, an LP and MIP solver with bit-identical results and its own independent checker"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["jaos"]
include-package-data = true

[tool.setuptools.package-data]
jaos = ["libjaos.so"]
