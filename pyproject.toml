[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jaos"
version = "0.3.0"
description = "JAOS, an LP, MIP, QP and conic solver with bit-identical results and its own independent checker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Vall", email = "vall@jaos.dev" }]

[project.urls]
Homepage = "https://github.com/avallavall/jaos"
Repository = "https://github.com/avallavall/jaos"
Issues = "https://github.com/avallavall/jaos/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["jaos"]
include-package-data = true

[tool.setuptools.package-data]
jaos = ["libjaos.so", "libjaos.dll", "libjaos.dylib"]
