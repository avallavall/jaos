# Manifest for /gsd-ingest-docs --mode new --manifest .planning/ingest-manifest.yaml
#
# Why this file exists: GSD's automatic discovery (listPlanningDocCandidates in
# gsd-core/bin/lib/onboard-projection.cjs) only scans docs/, adr/, prd/, spec/,
# rfc/ and requires filenames matching /(^|[-_ ])(ADR|PRD|SPEC|RFC)([-_ ]|\.)/i.
# JAOS keeps its planning documents at the repo root under names that match none
# of those rules, so doc_candidate_count came back 0. This manifest names them
# explicitly.
#
# Precedence: lower number wins a conflict. DECISIONS.md is first because its
# entries are closed decisions backed by measurement — a requirement derived from
# any other document must not contradict one.

docs:
  # Closed decisions, each with the measurement that closed it (92 entries, D1-D92).
  # Typed ADR because that is exactly what it is. Highest precedence: these are
  # constraints on the roadmap, not proposals for it. Cited ~274 times from source
  # and docs, so it stays in place at the repo root — ingest is for conflict
  # detection, not for relocating it.
  - path: DECISIONS.md
    type: ADR
    precedence: 0

  # What JAOS is built to be, and where every feature stands.
  - path: SPECS.md
    type: SPEC
    precedence: 1

  # What is open, in the order it will be done. This is the document GSD's
  # ROADMAP.md + REQUIREMENTS.md are meant to replace.
  - path: PLAN.md
    type: PRD
    precedence: 2

  # Reference material: tolerances, work units, scaling, format support.
  - path: docs/tolerances.md
    type: DOC
    precedence: 3
  - path: docs/work-units.md
    type: DOC
    precedence: 3
  - path: docs/scaling.md
    type: DOC
    precedence: 3
  - path: docs/format-support.md
    type: DOC
    precedence: 3

  # The acceptance gate and how JAOS is compared against other solvers.
  - path: bench/README.md
    type: DOC
    precedence: 4
  - path: bench/compare/README.md
    type: DOC
    precedence: 4

  # Public framing of the project.
  - path: README.md
    type: DOC
    precedence: 5

# Deliberately NOT ingested: CHANGELOG.md (747 lines). It records what changed and
# what it cost — history, not intent — and this project's own rule is that the
# changelog is not a decision record. Reasoning that belongs to a decision is in
# DECISIONS.md, which is ingested above. Add it back here as type DOC, precedence 6
# if a later milestone needs it.
